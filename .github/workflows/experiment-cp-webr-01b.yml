name: Experiment CP-WEBR-01B

permissions:
  contents: read

on:
  push:
    paths:
      - 'experiments/cp-webr-01b/**'
      - 'docs/audits/CP-WEBR-01B-ARCHITECTURE-ERRATA.md'
      - '.github/workflows/experiment-cp-webr-01b.yml'
  pull_request:
    paths:
      - 'experiments/cp-webr-01b/**'
      - 'docs/audits/CP-WEBR-01B-ARCHITECTURE-ERRATA.md'
      - '.github/workflows/experiment-cp-webr-01b.yml'

jobs:
  qualification-validation:
    name: CP-WEBR-01B Security, Binding & Artifact Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Verify artifact manifest integrity (committed baseline)
        run: node experiments/cp-webr-01b/harness/verify_manifest.mjs

      - name: Setup experiment dependencies & install webr
        run: |
          node experiments/cp-webr-00b/harness/setup_experiment.mjs
          npm install --no-save webr@0.6.0

      - name: Run alias mapping and canonical serialization unit suite
        run: node experiments/cp-webr-01b/harness/test_alias_and_serialization.mjs

      - name: Test qualification server headers, negative controls & mock falsification sink
        run: |
          node -e "
            import('./experiments/cp-webr-01b/browser-harness/server.mjs').then(({ createServer, PORT }) => {
              const s = createServer();
              s.listen(PORT, async () => {
                const res = await fetch('http://localhost:' + PORT + '/index.html');
                const coop = res.headers.get('cross-origin-opener-policy');
                const coep = res.headers.get('cross-origin-embedder-policy');
                const corp = res.headers.get('cross-origin-resource-policy');
                const csp = res.headers.get('content-security-policy');
                console.log('COOP:', coop);
                console.log('COEP:', coep);
                console.log('CORP:', corp);
                console.log('CSP:', csp);
                if (coop !== 'same-origin' || coep !== 'require-corp' || corp !== 'same-origin') {
                  throw new Error('Missing COOP/COEP/CORP isolation headers');
                }
                const trapRes = await fetch('http://localhost:' + PORT + '/api/prohibited-leak-page-prevention', { method: 'POST' });
                if (trapRes.status !== 400) throw new Error('Expected 400 on negative control page prevention trap');
                const sinkRes = await fetch('http://localhost:' + PORT + '/api/mock-falsification-sink', {
                  method: 'POST',
                  body: JSON.stringify({ sentinel: 'FALSIFICATION_SENTINEL_PAYLOAD_339a1c' })
                });
                if (sinkRes.status !== 200) throw new Error('Expected 200 on mock falsification sink');
                const sinkJson = await sinkRes.json();
                if (!sinkJson.matchedSentinel) throw new Error('Mock sink did not match sentinel');
                console.log('Server headers, negative controls & falsification sink verified successfully!');
                s.close();
                process.exit(0);
              });
            });
          "

      - name: Run WebR parameter binding, 21 adversarial cases & native R parity check
        run: node experiments/cp-webr-01b/harness/test_webr_binding.mjs

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run real Chromium browser security, true offline & falsification suite
        run: node experiments/cp-webr-01b/harness/test_browser_security.mjs

      - name: Verify browser qualification verdicts
        run: |
          node -e "
            const report = JSON.parse(require('fs').readFileSync('experiments/cp-webr-01b/BROWSER-CI-QUALIFICATION-REPORT.json'));
            console.log('Browser qualification verdicts:', report.verdicts);
            if (report.exit_code !== 0) throw new Error('Browser qualification exit code was non-zero');
            if (report.verdicts.TRUE_OFFLINE_EXECUTION !== 'PASS') throw new Error('TRUE_OFFLINE_EXECUTION did not pass');
            if (report.verdicts.NETWORK_FALSIFICATION !== 'PASS') throw new Error('NETWORK_FALSIFICATION did not pass');
            if (report.verdicts.INDEXEDDB_SCANNER_FALSIFICATION !== 'PASS') throw new Error('INDEXEDDB_SCANNER_FALSIFICATION did not pass');
            if (report.verdicts.INDEXEDDB_FAIL_CLOSED !== 'PASS') throw new Error('INDEXEDDB_FAIL_CLOSED did not pass');
            if (report.verdicts.PERSISTENCE_ISOLATION !== 'PASS') throw new Error('PERSISTENCE_ISOLATION did not pass');
            if (report.verdicts.CSP_PAGE_WORKER_ISOLATION !== 'PASS') throw new Error('CSP_PAGE_WORKER_ISOLATION did not pass');
            if (report.verdicts.WORKER_CSP_EXCEPTION !== 'PASS') throw new Error('WORKER_CSP_EXCEPTION did not pass');
            if (report.verdicts.EXACT_PAIR_AND_WEIGHT_PARITY !== 'PASS') throw new Error('EXACT_PAIR_AND_WEIGHT_PARITY did not pass');
            if (report.verdicts.CHROMIUM_SECURITY_QUALIFICATION !== 'PASS') throw new Error('CHROMIUM_SECURITY_QUALIFICATION did not pass');
            if (report.verdicts.CHROMIUM_BROWSER_CI !== 'PASS') throw new Error('CHROMIUM_BROWSER_CI did not pass');
            console.log('All CI browser qualification gates verified PASS!');
          "

      - name: Generate post-run CI evidence manifest
        run: node experiments/cp-webr-01b/harness/generate_ci_manifest.mjs

      - name: Upload CP-WEBR-01B Qualification Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp-webr-01b-qualification-evidence
          path: |
            experiments/cp-webr-01b/*.json
            experiments/cp-webr-01b/fixtures/fix_01_oracle_full_precision.json
          retention-days: 90
