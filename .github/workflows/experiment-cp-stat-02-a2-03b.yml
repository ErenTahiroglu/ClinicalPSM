name: CP-STAT-02 A2-03B Frozen HiGHS Forensics

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/experiment-cp-stat-02-a2-03b.yml"
      - "experiments/cp-stat-02/a2-f1/highs-forensics/A2_03B_*"
      - "experiments/cp-stat-02/a2-f1/highs-forensics/a2_03b_harness.py"
      - "experiments/cp-stat-02/a2-f1/highs-forensics/requirements-a2-03b.lock"

permissions:
  actions: read
  contents: read

jobs:
  frozen-highs-experiment:
    name: One bounded A2-03B numerical-forensics run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact pushed development commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Create evidence staging directory
        shell: bash
        run: mkdir -p .a2-03b .a2-03b/evidence .a2-03b/download

      - name: Snapshot preregistered Python toolcache before setup
        id: python_toolcache_snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cp-stat-02/a2-f1/highs-forensics/a2_03b_harness.py snapshot-python-toolcache \
            --output .a2-03b/evidence/python-toolcache-pre-setup.json

      - name: Set up the preregistered CPython
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"
          architecture: x64
          check-latest: false
          mirror: "https://raw.githubusercontent.com/actions/python-versions/9834b4e4911ca2950ff6c3b7547f09eacc006848"

      - name: Install only the hash-locked wheels
        id: wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --force-reinstall \
            --only-binary=:all: \
            --require-hashes \
            --report .a2-03b/pip-install-report.json \
            -r experiments/cp-stat-02/a2-f1/highs-forensics/requirements-a2-03b.lock

      - name: Verify frozen inputs and run the single 32-cell experiment
        id: experiment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SETUP_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
          SETUP_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
        shell: bash
        run: |
          set -euo pipefail
          python experiments/cp-stat-02/a2-f1/highs-forensics/a2_03b_harness.py run \
            --evidence-dir .a2-03b/evidence \
            --download-dir .a2-03b/download \
            --pip-report .a2-03b/pip-install-report.json \
            --toolcache-snapshot .a2-03b/evidence/python-toolcache-pre-setup.json

      - name: Record a setup blocker if pinned runtime or wheel installation did not complete
        if: always()
        env:
          SETUP_PYTHON_OUTCOME: ${{ steps.python.outcome }}
          WHEEL_INSTALL_OUTCOME: ${{ steps.wheels.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .a2-03b/evidence/execution-status.json ]; then
            python3 experiments/cp-stat-02/a2-f1/highs-forensics/a2_03b_harness.py record-blocker \
              --evidence-dir .a2-03b/evidence \
              --pip-report .a2-03b/pip-install-report.json \
              --message "Pre-setup interpreter provenance snapshot, pinned CPython setup, or locked-wheel installation failed before preflight; zero LP calls."
          fi

      - name: Upload checksummed evidence, including blocked or inconclusive runs
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp-stat-02-a2-03b-${{ github.run_id }}
          path: .a2-03b/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Record run and artifact receipt
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome || 'NOT_RUN' }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id || 'NOT_UPLOADED' }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest || 'NOT_REPORTED' }}
        shell: bash
        run: |
          {
            printf -- '## CP-STAT-02 A2-03B\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Workflow run: `%s` (attempt `%s`)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Experiment outcome: `%s`\n' "$EXPERIMENT_OUTCOME"
            printf -- '- Evidence artifact ID: `%s`\n' "$EVIDENCE_ARTIFACT_ID"
            printf -- '- GitHub artifact digest: `%s`\n' "$EVIDENCE_ARTIFACT_DIGEST"
            if [ -s .a2-03b/evidence/execution-status.json ]; then
              IFS=$'\t' read -r FINAL_VERDICT LP_INVOCATIONS < <(
                python3 -c 'import json; p=json.load(open(".a2-03b/evidence/execution-status.json", encoding="utf-8")); print(p.get("verdict") or "UNMEASURED", p.get("linprog_invocation_attempts", "UNMEASURED"), sep="\t")'
              )
              printf -- '- Verdict: `%s`\n' "$FINAL_VERDICT"
              printf -- '- LP invocation attempts: `%s / 32`\n' "$LP_INVOCATIONS"
            else
              printf -- '- Verdict: `UNMEASURED`\n'
              printf -- '- LP invocation attempts: `UNMEASURED / 32`\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
