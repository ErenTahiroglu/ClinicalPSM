name: Security (gitleaks)

# Secret scanning with a version-pinned, checksum-verified Gitleaks CLI (no third-party action, no licence key).
# Findings are redacted; no report is uploaded; the log never contains secret values.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks (history + self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks (sha256-verified)
        run: bash scripts/devtools/install-gitleaks.sh
      - name: Scan history (new findings fail; baseline findings are listed, never hidden)
        run: bash scripts/devtools/gitleaks.sh history
      - name: Current tracked tree must contain ZERO live secrets (no baseline applies)
        run: bash scripts/devtools/gitleaks.sh current
      - name: Scanner self-test (synthetic positives and negatives, baseline semantics)
        run: bash scripts/devtools/gitleaks.sh selftest
      - name: Known historical findings (visible warning; an accepted baseline is NOT remediation)
        run: |
          python3 - <<'PY'
          import json
          b=json.load(open('.gitleaks-baseline.json'))
          print(f"::warning::{len(b)} known gitleaks baseline finding(s) remain unresolved (credential rotation required); see docs/audits/DEVTOOLS-00-INTEGRATION-REPORT.md")
          for f in b: print(f"  rule={f['RuleID']} file={f['File']} line={f['StartLine']} commit={f['Commit'][:8]}")
          PY
