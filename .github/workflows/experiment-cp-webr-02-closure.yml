name: CP-WEBR-02 Closure Native R Feasibility Gate

on:
  push:
    branches: [development]
    paths:
      - "apps/web/**"
      - "src/lib/webr/**"
      - "src/worker/**"
      - "experiments/cp-webr-02a/fixtures/**"
      - "experiments/cp-webr-02-closure/**"
      - "experiments/cp-webr-02b/**"
      - ".github/workflows/experiment-cp-webr-02-closure.yml"
  pull_request:
    branches: [development]
    paths:
      - "apps/web/**"
      - "src/lib/webr/**"
      - "src/worker/**"
      - "experiments/cp-webr-02a/fixtures/**"
      - "experiments/cp-webr-02-closure/**"
      - "experiments/cp-webr-02b/**"
      - ".github/workflows/experiment-cp-webr-02-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-feasibility:
    name: Exact native R, package integrity and two-fixture execution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node for source integrity verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install exact native R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.6.0"
          use-public-rspm: false
          cran: https://cran.r-project.org

      - name: Verify all locked CRAN source archive hashes
        run: node experiments/cp-webr-02-closure/package_sources.mjs verify

      - name: Restore committed lock with documented setup-renv
        uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: experiments/cp-webr-02-closure
          profile: "NULL"
          bypass-cache: "true"

      - name: Execute direct native R feasibility probes
        env:
          CP_WEBR_CLOSURE_MODE: verify
          CP_WEBR_RENV_PROJECT: ${{ github.workspace }}/experiments/cp-webr-02-closure
          CP_WEBR_FEASIBILITY_REPORT: ${{ github.workspace }}/experiments/cp-webr-02-closure/native-feasibility-evidence.json
        run: |
          set -euo pipefail
          Rscript --version
          Rscript native_feasibility.R
          cat "$CP_WEBR_FEASIBILITY_REPORT"
          Rscript -e 'print(sessionInfo())'
        working-directory: experiments/cp-webr-02-closure
        shell: bash

      - name: Upload Gate A evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp-webr-02-closure-native-feasibility-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            experiments/cp-webr-02-closure/native-feasibility-evidence.json
            experiments/cp-webr-02-closure/renv.lock
            experiments/cp-webr-02-closure/source-package-integrity.json
