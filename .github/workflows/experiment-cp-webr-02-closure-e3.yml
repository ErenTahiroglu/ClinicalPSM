name: CP-WEBR-02 E3 Candidate Erratum Qualification

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/experiment-cp-webr-02-closure-e3.yml"
      - "experiments/cp-webr-02-closure/e3/**"
      - "experiments/cp-webr-02-closure/fixture-integrity.json"
      - "experiments/cp-webr-02a/adapter/r_template.R"
      - "experiments/cp-webr-02a/fixtures/**"
      - "experiments/cp-webr-02a/r1.2a/FIXTURE-ASSERTION-MATRIX.json"
      - "experiments/cp-webr-00b/dependency-lock.json"
      - "apps/web/**"
      - "src/lib/webr/**"
      - "src/worker/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  e3-adjudication:
    name: Verify pinned evidence and adjudicate all 25 frozen fixtures
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify baseline ancestry, main pin, immutable assets, dependencies, and production-source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/development"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor f3bf77f1d730cedf4d728ddc58d32b885c63b3bb HEAD
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "53fb05e7c8d9b77b46c4a5d8b7c9cc041345f6a6"
          git diff --exit-code 1ca14f6ab3c41d1ba366db0adda22102acc90a3c HEAD -- \
            apps/web \
            src/lib/webr \
            src/worker \
            experiments/cp-webr-02a/adapter \
            experiments/cp-webr-02a/fixtures \
            experiments/cp-webr-02a/CP-WEBR-02A-EXPERIMENT-CONTRACT.md \
            experiments/cp-webr-02a/CP-WEBR-02A-R1.2a-TEST-CONTRACT.md \
            experiments/cp-webr-02a/r1.2a/FIXTURE-ASSERTION-MATRIX.json \
            experiments/cp-webr-02-closure/native_oracle.R \
            experiments/cp-webr-02-closure/compare_closure.mjs \
            experiments/cp-webr-02-closure/fixture-integrity.json \
            docs/architecture/CP-WEBR-01-PRODUCTION-ARCHITECTURE.md
          test "$(shasum -a 256 experiments/cp-webr-02a/fixtures/fixtures_manifest.json | awk '{print $1}')" = "e799ff01a9606c91cb3d494e277e081cabdc1349a37c993a08e7057d7411e4b1"
          test "$(shasum -a 256 experiments/cp-webr-02a/adapter/r_template.R | awk '{print $1}')" = "7989403c7d093031b93a9c971a6d4f055101bab83c0ec4417fc52e4dceee24a4"
          test "$(shasum -a 256 experiments/cp-webr-02a/r1.2a/FIXTURE-ASSERTION-MATRIX.json | awk '{print $1}')" = "c53ed65845adfa0bdd61011ab7ba6667b5662f4144a438a0443898adc0cabeea"
          test "$(shasum -a 256 experiments/cp-webr-02-closure/native_oracle.R | awk '{print $1}')" = "fe524d3330b59ef8b2b60b1b93cd1d21ed4b02ab9e62642b432078bf4d706f87"
          test "$(shasum -a 256 experiments/cp-webr-02a/CP-WEBR-02A-EXPERIMENT-CONTRACT.md | awk '{print $1}')" = "8e032108c05f963a56c165ee375376704dd140472e45ac914965569b9260e7a6"
          test "$(shasum -a 256 experiments/cp-webr-02a/CP-WEBR-02A-R1.2a-TEST-CONTRACT.md | awk '{print $1}')" = "d52d7dab68c6150bddcb1e471aa8ecfc9904964b51042b5a9ce2222900f86850"
          test "$(shasum -a 256 docs/architecture/CP-WEBR-01-PRODUCTION-ARCHITECTURE.md | awk '{print $1}')" = "005f1300fde92d1509958d9058526ab8ae98c992ccfc09f3e9d13995eae44bca"
          node -e 'const f=require("node:fs");const p=JSON.parse(f.readFileSync("package.json"));const l=JSON.parse(f.readFileSync("package-lock.json"));const d=JSON.parse(f.readFileSync("experiments/cp-webr-00b/dependency-lock.json"));if(p.dependencies.next!=="16.4.1"||p.devDependencies["eslint-config-next"]!=="16.4.1"||l.packages[""].dependencies.next!=="16.4.1"||l.packages[""].devDependencies["eslint-config-next"]!=="16.4.1"||d.runtime.webr_npm!=="0.6.0"||d.runtime.r_version!=="4.6.0")process.exit(1);console.log("Next.js, eslint-config-next and WebR runtime pins verified")'
          printf 'E3 commit=%s\nmain=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)"

      - name: Install pinned Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Download preserved 25-fixture production Worker evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: ${{ github.repository }}
          run-id: "39954671878"
          artifact-ids: "12501434045"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cp-webr-e3/legacy-download

      - name: Download the already completed E2 scientific evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: ${{ github.repository }}
          run-id: "40021019295"
          artifact-ids: "12532397023"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cp-webr-e3/e2-download

      - name: Verify GitHub artifact identity and extract the pinned evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: "12501434045"
          LEGACY_RUN_ID: "39954671878"
          LEGACY_DIGEST: "sha256:e41eafc0bf236997063b9c3a868371f974275fd3a5c3a81d8ef3a0f29aaef230"
          LEGACY_COMMIT: "1ca14f6ab3c41d1ba366db0adda22102acc90a3c"
          E2_ARTIFACT_ID: "12532397023"
          E2_RUN_ID: "40021019295"
          E2_DIGEST: "sha256:bb0d2cb66a9b983d40f04703fcd318fa1c76b6a02ca0d58be6bb7d858f902df3"
          E2_COMMIT: "f3bf77f1d730cedf4d728ddc58d32b885c63b3bb"
          E3_TEMP: ${{ runner.temp }}/cp-webr-e3
        shell: bash
        run: |
          set -euo pipefail
          for item in "${LEGACY_ARTIFACT_ID}:${LEGACY_RUN_ID}:${LEGACY_DIGEST}" "${E2_ARTIFACT_ID}:${E2_RUN_ID}:${E2_DIGEST}"; do
            artifact_id="${item%%:*}"
            remaining="${item#*:}"
            run_id="${remaining%%:*}"
            digest="${remaining#*:}"
            metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
            test "$(printf '%s' "$metadata" | jq -r '.digest')" = "$digest"
            test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
            test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id|tostring')" = "$run_id"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LEGACY_RUN_ID}" --jq '.head_sha')" = "$LEGACY_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${E2_RUN_ID}" --jq '.head_sha')" = "$E2_COMMIT"
          mkdir -p "$E3_TEMP/legacy" "$E3_TEMP/e2"
          legacy_archive="$(find "$E3_TEMP/legacy-download" -type f -name 'cp-webr-02-closure-evidence.tar.gz' -print -quit)"
          e2_archive="$(find "$E3_TEMP/e2-download" -type f -name 'evidence.tar.gz' -print -quit)"
          test -n "$legacy_archive"
          test -n "$e2_archive"
          tar -xzf "$legacy_archive" -C "$E3_TEMP/legacy"
          e2_artifact_dir="$(find "$E3_TEMP/e2-download" -type f -name 'webr-shadow-diagnostics.json' -print -quit)"
          test -n "$e2_artifact_dir"
          e2_artifact_dir="${e2_artifact_dir%/*}"
          printf 'LEGACY_ARCHIVE=%s\nLEGACY_DIR=%s\nE2_ARCHIVE=%s\nE2_DIR=%s\n' \
            "$legacy_archive" "$E3_TEMP/legacy" "$e2_archive" "$e2_artifact_dir" >> "$GITHUB_ENV"

      - name: Run E3 serialization and falsification tests
        run: node --test experiments/cp-webr-02-closure/e3/adjudicate.test.mjs

      - name: Replay the additive adjudicator against archived evidence
        env:
          OUTPUT_DIR: ${{ runner.temp }}/cp-webr-e3/output
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          node experiments/cp-webr-02-closure/e3/adjudicate.mjs \
            --legacy-dir "$LEGACY_DIR" \
            --legacy-archive "$LEGACY_ARCHIVE" \
            --e2-dir "$E2_DIR" \
            --e2-archive "$E2_ARCHIVE" \
            --output-dir "$OUTPUT_DIR"
          cp experiments/cp-webr-02-closure/e3/CP-WEBR-02-NATIVE-PARITY-ERRATUM-v1.md "$OUTPUT_DIR/"
          cp experiments/cp-webr-02-closure/e3/evidence-pins.json "$OUTPUT_DIR/"
          cp experiments/cp-webr-02-closure/e3/adjudicate.mjs "$OUTPUT_DIR/"
          cp experiments/cp-webr-02-closure/e3/adjudicate.test.mjs "$OUTPUT_DIR/"
          cp experiments/cp-webr-02-closure/e3/write_evidence_index.mjs "$OUTPUT_DIR/"
          cp .github/workflows/experiment-cp-webr-02-closure-e3.yml "$OUTPUT_DIR/"
          git rev-parse HEAD > "$OUTPUT_DIR/commit-sha.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$OUTPUT_DIR/workflow-run-id.txt"
          node experiments/cp-webr-02-closure/e3/write_evidence_index.mjs "$OUTPUT_DIR"

      - name: Upload E3 machine and human-readable evidence
        id: upload-e3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp-webr-02-closure-e3-${{ github.run_id }}
          path: ${{ runner.temp }}/cp-webr-e3/output/
          if-no-files-found: error
          retention-days: 90

      - name: Re-download and verify uploaded evidence
        if: always() && steps.upload-e3.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cp-webr-02-closure-e3-${{ github.run_id }}
          path: ${{ runner.temp }}/cp-webr-e3/upload-check

      - name: Record workflow and artifact provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-e3.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-e3.outputs.artifact-digest }}
          E3_TEMP: ${{ runner.temp }}/cp-webr-e3
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$ARTIFACT_ID"; then
            api_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest')"
            test "${api_digest#sha256:}" = "${ARTIFACT_DIGEST#sha256:}"
            if test -f "$E3_TEMP/upload-check/SHA256SUMS"; then
              (cd "$E3_TEMP/upload-check" && sha256sum -c SHA256SUMS)
            fi
            {
              printf '\n### E3 candidate evidence\n\n'
              printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
              printf 'Workflow run: `%s`\n\n' "$GITHUB_RUN_ID"
              printf 'Artifact ID: `%s`\n\n' "$ARTIFACT_ID"
              printf 'Artifact SHA-256: `sha256:%s`\n\n' "${ARTIFACT_DIGEST#sha256:}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nE3 evidence artifact was not created; inspect the failed qualification steps.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
